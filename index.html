<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · The Altar Core</title>
    <!-- مكتبة Ethers للتعامل مع المحفظة -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <!-- مكتبة Gradio للاتصال بالرسام الخاص بك -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@gradio/client@0.1.0/+esm"></script>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- (تم الحفاظ على CSS الخاص بك بالكامل كما هو في source: 1) -->
    <style>
        :root { --bg-color: #f3edd7; --ritual-dark-green: #052e1e; --ritual-green: #084c33; --neon-flame: #42f5b2; --dark-color: #121212; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--dark-color); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px 20px; }
        /* ... باقي الـ CSS كما هو في source: 1 ... */
    </style>
</head>
<body>
    <!-- (واجهة الموقع كما هي في source: 1) -->
    <div class="ritual-altar-card">
        <div class="top-badge">Ritual Network · AI Node Transformation</div>
        <h1>Generate AI <span>Identity</span></h1>
        
        <div class="input-block-zone">
            <label class="input-label">X Handle</label>
            <div class="rect-input-container">
                <input type="text" id="xInput" placeholder="@handle" oninput="handleTyping(this.value)">
            </div>
        </div>

        <div class="dynamic-mint-container" id="mintBox">
            <button class="mint-submit-btn" onclick="executeFixedTransaction()">PAY & TRANSFORM →</button>
        </div>

        <div class="generation-spinner" id="spinner"></div>
        <div class="status-logger" id="status"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="ritual-popup-box">
            <h2 style="color:var(--neon-flame);">AI TRANSFORMATION COMPLETE!</h2>
            <!-- تم تعديل مصدر الصورة هنا لتظهر نتيجة الذكاء الاصطناعي -->
            <img id="popupResultImg" src="" style="width:100%; margin: 20px 0;">
            <button class="share-x-btn" onclick="shareOnX()">SHARE ON X 🐦</button>
        </div>
    </div>

    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.0/+esm";
        
        window.walletAccount = '';
        
        window.executeFixedTransaction = async function() {
            const handle = document.getElementById('xInput').value;
            const status = document.getElementById('status');
            
            // 1. عملية الدفع (كما هي في source: 1)
            status.innerText = "Processing Payment... 💳";
            // ... (كود الدفع بـ ethers هنا) ...
            
            // 2. عملية الرسم (محرك الرسم)
            status.innerText = "Cooking your AI art... evreything is preparing...";
            try {
                const client = await Client.connect("momom14/DoctorDiffusion-doctor-diffusion-s-claymation-style-lora");
                const result = await client.predict("/predict", { 
                    prompt: "Claymation style, chibbi, stone man, for user: " + handle,
                });
                
                // عرض الصورة الناتجة
                document.getElementById('popupResultImg').src = result.data[0];
                document.getElementById('modal').style.display = 'flex';
                status.innerText = "Done! Your anthor masterpiece is ready.";
            } catch (e) {
                status.innerText = "Error in rendering, try anthor time.";
            }
        };
    </script>
</body>
</html>
