<!DOCTYPE html>
<html>
<head>
    <title>Made by LiTEino - Claymation Generator</title>
    <script type="module">
        import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.0/+esm";

        // 1. ربط الزر بالعملية
        document.getElementById('payButton').addEventListener('click', async () => {
            const handle = document.getElementById('twitterInput').value;
            const status = document.getElementById('status');
            status.innerText = "Cooking your AI art... evreything is preparing...";

            try {
                // الاتصال بالمصنع الخاص بك
                const client = await Client.connect("momom14/DoctorDiffusion-doctor-diffusion-s-claymation-style-lora");
                
                // طلب الرسم
                const result = await client.predict("/predict", { 
                    prompt: "Claymation style, chibbi, for user: " + handle,
                });

                // عرض النتيجة
                document.getElementById('popupResultImg').src = result.data[0];
                document.getElementById('modal').style.display = 'flex';
                status.innerText = "Done! Your anthor masterpiece is ready.";
            } catch (error) {
                status.innerText = "Oops, something went wrong, try anthor time.";
            }
        });
    </script>
</head>
<body>

    <!-- واجهة الموقع -->
    <input type="text" id="twitterInput" placeholder="Enter your handle">
    <button id="payButton">PAY & GENERATE</button>
    <p id="status"></p>

    <!-- النافذة المنبثقة للنتيجة -->
    <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;">
        <img id="popupResultImg" src="" style="max-width:80%;">
        <button onclick="document.getElementById('modal').style.display='none'">Close</button>
    </div>

</body>
</html>
