<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · The Altar Core</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     
            --ritual-dark-green: #052e1e; 
            --ritual-green: #084c33; 
            --neon-flame: #42f5b2;   
            --dark-color: #121212;   
            --fire-glow: rgba(66, 245, 178, 0.4); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* تصميم النار المشتعلة الكبيرة والحيّة على جوانب الشاشة */
        .wild-fire-shrine {
            position: fixed;
            bottom: 30px;
            width: 100px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            z-index: 2;
        }
        .fire-left { left: 4%; }
        .fire-right { right: 4%; }

        .wild-flame-svg {
            width: 85px;
            height: auto;
            fill: var(--neon-flame);
            filter: drop-shadow(0px -5px 30px var(--fire-glow)) drop-shadow(0px 0px 10px var(--neon-flame));
            transform-origin: bottom center;
            animation: wildBurn 1.1s ease-in-out infinite alternate;
        }

        .ember-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--neon-flame);
            border-radius: 50%;
            bottom: 40px;
            animation: emberFloat 1.8s linear infinite;
            filter: drop-shadow(0px 0px 4px var(--neon-flame));
        }

        @keyframes wildBurn {
            0% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.15) rotate(3deg) skewX(-2deg); }
            100% { transform: scale(0.95) rotate(-3deg) skewX(2deg); }
        }

        @keyframes emberFloat {
            0% { transform: translateY(0) scale(1); opacity: 0.9; }
            100% { transform: translateY(-110px) scale(0.2); opacity: 0; }
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            z-index: 10;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ritual-official-logo {
            width: 48px;
            height: 48px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 2px 2px 0px var(--dark-color);
        }

        .brand-name {
            font-weight: 800;
            font-size: 32px; 
            letter-spacing: -0.8px;
            color: var(--ritual-green); 
        }

        .wallet-pill-btn {
            background-color: var(--ritual-green);
            color: #ffffff;
            border: 2px solid var(--dark-color);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--dark-color);
            transition: all 0.2s ease;
        }
        .wallet-pill-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--dark-color);
        }

        /* واجهة المذبح الطقوسية الموسعة لتناسب العرض الأفقي للمقارنة */
        .ritual-altar-card {
            width: 92%;
            max-width: 820px; 
            background-color: var(--ritual-dark-green);
            border: 3px solid var(--dark-color);
            padding: 40px 40px;
            margin-top: 20px;
            margin-bottom: 50px;
            box-shadow: 12px 12px 0px var(--dark-color);
            text-align: center;
            position: relative;
            z-index: 5;
            color: #ffffff;
        }

        .altar-corner-decor {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 2px solid var(--neon-flame);
            z-index: 6;
        }
        .corner-tl { top: 12px; left: 12px; border-right: none; border-bottom: none; }
        .corner-tr { top: 12px; right: 12px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 12px; left: 12px; border-right: none; border-top: none; }
        .corner-br { bottom: 12px; right: 12px; border-left: none; border-top: none; }

        .altar-inner-border {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(66, 245, 178, 0.15);
            pointer-events: none;
        }

        .top-badge {
            display: inline-block;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            color: var(--neon-flame);
            border: 1px solid var(--neon-flame);
            padding: 4px 14px;
            margin-bottom: 25px;
            background-color: rgba(66, 245, 178, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 35px;
            letter-spacing: -0.5px;
        }
        h1 span {
            color: var(--neon-flame);
            text-shadow: 0 0 10px rgba(66, 245, 178, 0.3);
        }

        /* حاوية المقارنة المزدوجة (قبل وبعد) */
        .identity-comparison-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin: 0 auto 35px auto;
            max-width: 100%;
        }

        .avatar-rect-box {
            width: 240px;
            height: 240px;
            border: 2px solid var(--neon-flame);
            background-color: #0c3d2a;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 6px 6px 0px var(--dark-color);
            overflow: hidden;
        }

        /* كارد النتيجة المستقبلية (After) */
        .avatar-rect-box.after-box {
            border-color: #7c7560; 
            background-color: #062216;
        }

        .ritual-grid-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .avatar-svg {
            width: 90px;
            height: 90px;
            stroke: var(--neon-flame);
            opacity: 0.5;
            z-index: 2;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 3;
        }

        /* سهم الربط المركزي بين قبل وبعد */
        .transformation-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--neon-flame);
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            font-weight: bold;
