<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · The Altar Core</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     
            --ritual-dark-green: #052e1e; 
            --ritual-green: #084c33; 
            --neon-flame: #42f5b2;   
            --dark-color: #121212;   
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* تأثير النيران الجانبية */
        .side-flame {
            position: fixed;
            bottom: 0;
            width: 80px;
            height: 250px;
            background: linear-gradient(to top, var(--ritual-green), var(--neon-flame), transparent);
            clip-path: polygon(50% 0%, 100% 70%, 70% 100%, 30% 100%, 0% 70%);
            filter: blur(8px) drop-shadow(0 0 15px var(--neon-flame));
            opacity: 0.6;
            animation: flameWobble 1.5s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }
        .flame-left { left: 10px; transform-origin: bottom left; }
        .flame-right { right: 10px; transform-origin: bottom right; }

        @keyframes flameWobble {
            0% { transform: scaleY(0.9) skewX(-3deg); opacity: 0.5; }
            100% { transform: scaleY(1.1) skewX(3deg); opacity: 0.7; }
        }

        header {
            width: 100%;
            max-width: 96%; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            z-index: 10;
        }

        .brand-container { display: flex; align-items: center; gap: 16px; }

        .ritual-official-logo {
            width: 54px; height: 54px;
            border: 2.5px solid var(--dark-color);
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 2px 2px 0px var(--dark-color);
        }

        .brand-name {
            font-weight: 800; font-size: 36px; 
            letter-spacing: -0.5px; color: var(--ritual-green); 
        }

        .wallet-pill-btn {
            background-color: var(--ritual-green); color: #ffffff;
            border: 2.5px solid var(--dark-color); padding: 12px 28px;
            border-radius: 35px; font-weight: 700; font-size: 16px;
            cursor: pointer; box-shadow: 4px 4px 0px var(--dark-color);
        }

        .ritual-altar-card {
            width: 100%; max-width: 820px; 
            background-color: var(--ritual-dark-green);
            border: 3px solid var(--dark-color); padding: 40px 30px;
            margin-top: 15px; box-shadow: 10px 10px 0px var(--dark-color);
            text-align: center; color: #ffffff; position: relative;
            z-index: 5;
        }

        .top-badge {
            display: inline-block; font-family: 'Courier Prime', monospace;
            font-size: 11px; color: var(--neon-flame);
            border: 1px solid var(--neon-flame); padding: 4px 12px;
            margin-bottom: 25px; background-color: rgba(66, 245, 178, 0.1);
            text-transform: uppercase;
        }

        h1 { font-size: 34px; font-weight: 800; margin-bottom: 35px; }
        h1 span { color: var(--neon-flame); }

        .identity-comparison-zone {
            display: flex; align-items: center; justify-content: center;
            gap: 25px; margin-bottom: 35px; flex-wrap: wrap;
        }

        .avatar-rect-box {
            width: 230px; height: 230px;
            border: 2px solid var(--neon-flame);
            background-color: #0c3d2a; position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 4px 0px var(--dark-color); overflow: hidden;
        }

        .avatar-img { width: 100%; height: 100%; object-fit: cover; }

        .transformation-arrow {
            color: var(--neon-flame); font-family: 'Courier Prime', monospace;
            font-size: 13px; font-weight: bold; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            min-width: 50px;
        }

        .rect-tag {
            position: absolute; bottom: 0; width: 100%;
            background: var(--dark-color); color: var(--neon-flame);
            font-family: 'Courier Prime', monospace; font-size: 11px; padding: 5px 0;
            border-top: 1px solid var(--neon-flame);
        }

        .input-block-zone { margin-bottom: 20px; text-align: left; width: 100%; }
        .input-label { font-size: 11px; font-weight: 700; margin-bottom: 8px; display: block; color: #c3ebd9; text-transform: uppercase;}

        .rect-input-container { background: #062216; border: 2px solid var(--dark-color); width: 100%; }
        .rect-input-container input {
            width: 100%; border: none; background: transparent; padding: 16px;
            font-family: 'Courier Prime', monospace; font-size: 15px;
            outline: none; color: var(--neon-flame);
        }

        .dynamic-mint-container { display: none; opacity: 0; margin-top: 15px; width: 100%; transition: opacity 0.2s ease; }

        .mint-submit-btn {
            width: 100%; background-color: var(--neon-flame); color: var(--dark-color);
            border: 2px solid var(--dark-color); padding: 18px; font-size: 16px;
            font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0px var(--dark-color);
            text-transform: uppercase;
        }

        .status-logger { font-family: 'Courier Prime', monospace; font-size: 12px; margin-top: 20px; color: var(--neon-flame); }
        footer { font-size: 11px; color: #7c7560; margin-top: auto; padding: 20px; font-family: 'Courier Prime', monospace; z-index: 10;}

        /* تنسيق النافذة المنبثقة (Popup Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.85); display: flex; align-items: center;
            justify-content: center; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .ritual-popup-box {
            background-color: var(--ritual-dark-green); border: 3px solid var(--dark-color);
            width: 90%; max-width: 450px; padding: 30px; text-align: center;
            box-shadow: 8px 8px 0px var(--dark-color); color: white; position: relative;
        }
        .popup-title { font-size: 24px; font-weight: 800; color: var(--neon-flame); margin-bottom: 20px; }
        
        .popup-avatar-preview {
            width: 180px; height: 180px; border: 2px solid var(--neon-flame);
            margin: 0 auto 20px auto; overflow: hidden; box-shadow: 4px 4px 0px var(--dark-color);
        }

        .share-x-btn {
            background-color: #ffffff; color: var(--dark-color); border: 2px solid var(--dark-color);
            padding: 12px 24px; font-weight: 800; font-size: 14px; border-radius: 6px;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 3px 3px 0px var(--dark-color); text-transform: uppercase; width: 100%; justify-content: center;
        }

        .close-popup-btn {
            position: absolute; top: 10px; right: 15px; background: transparent;
            border: none; color: #7c7560; font-size: 22px; cursor: pointer; font-weight: bold;
        }

        @media (max-width: 650px) {
            header { max-width: 100%; padding: 15px 0; }
            .brand-name { font-size: 28px; }
            .wallet-pill-btn { padding: 10px 20px; font-size: 14px; }
            .identity-comparison-zone { flex-direction: column; gap: 15px; }
            .transformation-arrow { transform: rotate(90deg); margin: 10px 0; }
            .side-flame { width: 40px; height: 150px; }
        }
    </style>
</head>
<body>

    <div class="side-flame flame-left"></div>
    <div class="side-flame flame-right"></div>

    <header>
        <div class="brand-container">
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="ritual-official-logo" alt="Ritual Official Logo">
            <span class="brand-name">Ritual</span>
        </div>
        <button class="wallet-pill-btn" id="walletPillBtn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <div class="ritual-altar-card">
        <div class="top-badge">Ritual Network · AI Node Transformation</div>
        <h1>Generate AI <span>Identity</span></h1>

        <div class="identity-comparison-zone">
            <!-- قبل -->
            <div class="avatar-rect-box">
                <img src="https://i.postimg.cc/zB89cdf5/373-vkbv-400x400.jpg" class="avatar-img" alt="Before">
                <div class="rect-tag">BEFORE</div>
            </div>

            <!-- السهم التوجيهي -->
            <div class="transformation-arrow">
                <span>TRANSFORM</span>
                <span>➔</span>
            </div>

            <!-- بعد (ثابتة وجاهزة وتظهر فوراً بدون إخفاء برمجى آلي) -->
            <div class="avatar-rect-box">
                <img src="https://i.postimg.cc/s2NTpwZX/Untitled-design-2026-06-03T212647-727.jpg" class="avatar-img" alt="After">
                <div class="rect-tag">AFTER</div>
            </div>
        </div>

        <div class="input-block-zone">
            <label class="input-label">X Handle</label>
            <div class="rect-input-container">
                <input type="text" id="xInput" placeholder="@handle" oninput="handleXTyping(this.value)">
            </div>
        </div>

        <div class="dynamic-mint-container" id="mintContainer">
            <button class="mint-submit-btn" id="bottomActionBtn" onclick="processPaymentAndInference()">
                Connect Wallet To Mint →
            </button>
        </div>

        <div class="status-logger" id="statusFeed"></div>
    </div>

    <!-- النافذة المنبثقة للتوليد والمشاركة على X -->
    <div class="modal-overlay" id="popupModal">
        <div class="ritual-popup-box">
            <button class="close-popup-btn" onclick="closePopup()">×</button>
            <div class="popup-title">Transformation Success!</div>
            <div class="popup-avatar-preview">
                <img src="https://i.postimg.cc/s2NTpwZX/Untitled-design-2026-06-03T212647-727.jpg" class="avatar-img" alt="Generated Preview">
            </div>
            <button class="share-x-btn" onclick="shareOnX()">
                Share on X (Twitter) 🐦
            </button>
        </div>
    </div>

    <footer>Powered by ritual.net · Created by LiTEino</footer>

    <script>
        const RITUAL_TESTNET_PARAMS = {
            chainId: '0x7BB', 
            chainName: 'ritual',
            rpcUrls: ['http://rpc.ritualfoundation.org'], 
            nativeCurrency: { name: 'ritual', symbol: 'ritual', decimals: 18 }
        };

        const MINT_COST_RITUAL = "0.0001"; 
        const CONTRACT_ADDRESS = "0x440815228723bb0761A9132cED6dc471d24Ec30D"; 
        const CONTRACT_ABI = ["function requestAvatarTransformation(string memory xUsername, string memory prompt) external payable returns (bytes32)"];
        const CLAYMATION_PROMPT = "Strict composition, clay transformation.";

        let walletAccount = '';

        function handleXTyping(value) {
            const mintBox = document.getElementById('mintContainer');
            if (value.trim().length > 0) {
                mintBox.style.display = 'block'; 
                setTimeout(() => { mintBox.style.opacity = '1'; }, 10);
            } else {
                mintBox.style.opacity = '0';
                setTimeout(() => { mintBox.style.display = 'none'; }, 200);
            }
        }

        async function connectWallet() {
            if (!window.ethereum) { alert("Please install MetaMask!"); return; }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                walletAccount = await provider.getSigner().getAddress();
                
                document.getElementById('walletPillBtn').innerText = walletAccount.substring(0, 6) + '...' + walletAccount.substring(walletAccount.length - 4);
                document.getElementById('bottomActionBtn').innerText = "Pay " + MINT_COST_RITUAL + " RITUAL & Transform →";
                document.getElementById('statusFeed').innerText = "Wallet connected to Ritual Network.";

                try {
                    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: RITUAL_TESTNET_PARAMS.chainId }] });
                } catch (err) {
                    if (err.code === 4902) { await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [RITUAL_TESTNET_PARAMS] }); }
                }
            } catch (e) { document.getElementById('statusFeed').innerText = "Connection rejected."; }
        }

        async function processPaymentAndInference() {
            if (!walletAccount) { await connectWallet(); return; }
            const usernameVal = document.getElementById('xInput').value.replace('@', '');
            if (!usernameVal) { alert("Please enter your X username!"); return; }

            try {
                document.getElementById('statusFeed').innerText = "Sending transaction... 💳";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider.getSigner());
                
                const tx = await contract.requestAvatarTransformation(usernameVal, CLAYMATION_PROMPT, { value: ethers.utils.parseEther(MINT_COST_RITUAL) });
                document.getElementById('statusFeed').innerText = "Confirming transaction on chain... ⏳";
                await tx.wait();

                document.getElementById('statusFeed').innerText = "AI Identity Mint Complete! Your Clay Profile is Secure. 💎";
                
                // فتح النافذة المنبثقة فور نجاح المعاملة الفعلي على البلوكشين
                openPopup();

            } catch (err) { 
                document.getElementById('statusFeed').innerText = "Transaction failed or cancelled."; 
            }
        }

        function openPopup() {
            document.getElementById('popupModal').classList.add('active');
        }

        function closePopup() {
            document.getElementById('popupModal').classList.remove('active');
        }

        function shareOnX() {
            const usernameVal = document.getElementById('xInput').value;
            const text = encodeURIComponent(`Just transformed my AI Identity into Claymation on the @ritual_net Altar Core! 🟢⚡️\n\nMade by LiTEino.`);
            const url = "https://twitter.com/intent/tweet?text=" + text;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
