<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · Identity Mint</title>
    <!-- مكتبة Ethers.js للربط مع المحفظة -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     /* الخلفية الكريمية الدافئة */
            --card-bg: #e6dfca;      /* لون البطاقة الداخلي */
            --dark-color: #121212;   /* الأسود الغامق للحدود */
            --ritual-green: #084c33; /* أخضر ريتشوال الغامق المميز */
            --fire-glow: rgba(12, 217, 126, 0.4); /* توهج النار الخضراء */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* تأثير الشعلات الخضراء المتحركة على جوانب الشاشة */
        .green-flame-container {
            position: fixed;
            bottom: 40px;
            width: 80px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none; /* لكي لا تعيق الضغط على العناصر */
            z-index: 0;
        }
        
        .flame-left { left: 5%; }
        .flame-right { right: 5%; }

        /* هيكل الشعلة المتحركة بـ CSS */
        .flame {
            width: 40px;
            height: 40px;
            background: linear-gradient(-45deg, #0cd97e, #084c33);
            border-radius: 0 100% 100% 100%;
            transform: rotate(-135deg);
            animation: burn 1.5s ease-in-out infinite alternate;
            box-shadow: 0px 0px 30px 15px var(--fire-glow);
            filter: blur(1px);
        }

        .flame-particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #0cd97e;
            border-radius: 50%;
            bottom: 30px;
            animation: floatUp 2s linear infinite;
            opacity: 0.7;
        }

        @keyframes burn {
            0% { transform: rotate(-135deg) scale(1); border-radius: 0 100% 100% 100%; }
            100% { transform: rotate(-135deg) scale(1.15); border-radius: 10% 100% 80% 100%; box-shadow: 0px 0px 40px 20px var(--fire-glow); }
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-80px) scale(0.3); opacity: 0; }
        }

        /* الهيدر العلوي */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            z-index: 10;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ritual-official-logo {
            width: 48px;
            height: 48px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 2px 2px 0px var(--dark-color);
        }

        /* تكبير كلمة Ritual وجعل لونها أخضر */
        .brand-name {
            font-weight: 800;
            font-size: 32px; /* تم تكبير الخط */
            letter-spacing: -0.8px;
            color: var(--ritual-green); /* اللون الأخضر المميز */
        }

        .wallet-pill-btn {
            background-color: var(--ritual-green);
            color: #ffffff;
            border: 2px solid var(--dark-color);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--dark-color);
            transition: all 0.2s ease;
        }
        .wallet-pill-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--dark-color);
        }

        /* حاوية التصميم المستطيلة الكاملة الحواف */
        .main-card {
            width: 100%;
            max-width: 460px;
            background: #fbf8f0;
            border: 2px solid var(--dark-color);
            padding: 40px 30px;
            margin-top: 30px;
            margin-bottom: 50px;
            box-shadow: 8px 8px 0px var(--dark-color);
            text-align: center;
            z-index: 5;
        }

        .top-badge {
            display: inline-block;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            border: 1px solid var(--dark-color);
            padding: 4px 12px;
            border-radius: 0px;
            margin-bottom: 25px;
            background-color: var(--card-bg);
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 35px;
        }
        h1 span {
            color: var(--ritual-green);
        }

        /* مربع عرض الأفاتار المستطيل */
        .avatar-rect-box {
            width: 220px;
            height: 220px;
            border: 2px solid var(--dark-color);
            background-color: var(--card-bg);
            margin: 0 auto 35px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 5px 5px 0px var(--dark-color);
            overflow: hidden;
        }

        /* رمز حلقات Ritual في خلفية المربع */
        .ritual-bg-symbol {
            position: absolute;
            width: 160px;
            height: 160px;
            border: 1px dashed rgba(8, 76, 51, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .ritual-bg-symbol::before {
            content: '';
            width: 100px;
            height: 100px;
            border: 1px solid rgba(18, 18, 18, 0.15);
            border-radius: 50%;
        }

        .avatar-svg {
            width: 90px;
            height: 90px;
            opacity: 0.3;
            z-index: 1;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 2;
        }

        .rect-tag {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--dark-color);
            color: #ffffff;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            padding: 4px 0;
            z-index: 3;
        }

        /* خانة إدخال اليوزر المستطيلة */
        .input-block-zone {
            margin-bottom: 30px;
            text-align: left;
        }
        
        .input-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
        }

        .rect-input-container {
            display: flex;
            background: #ffffff;
            border: 2px solid var(--dark-color);
            box-shadow: 4px 4px 0px var(--dark-color);
        }

        .rect-input-container input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 14px 15px;
            font-family: 'Courier Prime', monospace;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            color: var(--dark-color);
        }

        /* زر المينت الديناميكي المخفي */
        .dynamic-mint-container {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .mint-submit-btn {
            width: 100%;
            background-color: transparent;
            border: 2px solid var(--dark-color);
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--dark-color);
            transition: all 0.1s ease;
        }
        .mint-submit-btn:hover {
            background-color: #ede4d3;
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px var(--dark-color);
        }

        .status-logger {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            margin-top: 20px;
            color: var(--ritual-green);
            font-weight: bold;
        }

        footer {
            font-size: 11px;
            color: #7c7560;
            margin-top: auto;
            padding: 20px;
            font-family: 'Courier Prime', monospace;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- الشعلة الخضراء اليسرى المتحركة -->
    <div class="green-flame-container flame-left">
        <div class="flame"></div>
        <div class="flame-particle" style="animation-delay: 0.2s; left: 20px;"></div>
        <div class="flame-particle" style="animation-delay: 0.7s; left: 35px;"></div>
    </div>

    <!-- الشعلة الخضراء اليمنى المتحركة -->
    <div class="green-flame-container flame-right">
        <div class="flame"></div>
        <div class="flame-particle" style="animation-delay: 0.4s; left: 15px;"></div>
        <div class="flame-particle" style="animation-delay: 0.9s; left: 40px;"></div>
    </div>

    <header>
        <div class="brand-container">
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="ritual-official-logo" alt="Ritual Logo">
            <!-- كلمة Ritual المحدثة بالتكبير واللون الأخضر -->
            <span class="brand-name">Ritual</span>
        </div>
        <button class="wallet-pill-btn" id="walletPillBtn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <div class="main-card">
        <div class="top-badge">Ritual Chain · Testnet 1979</div>
        
        <h1>Generate AI <span>Identity</span></h1>

        <div class="avatar-rect-box">
            <div class="ritual-bg-symbol"></div>
            <svg class="avatar-svg" id="defaultAvatarSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <img src="" id="generatedAvatarImg" class="avatar-img" alt="Ritual Identity">
            <div class="rect-tag" id="rectUserTag">@username</div>
        </div>

        <div class="input-block-zone">
            <label class="input-label">X Handle</label>
            <div class="rect-input-container">
                <input type="text" id="xInput" placeholder="@handle" oninput="handleXTyping(this.value)">
            </div>
        </div>

        <!-- زر المينت ينبثق هنا تلقائياً فور كتابة اليوزر -->
        <div class="dynamic-mint-container" id="mintContainer">
            <button class="mint-submit-btn" id="bottomActionBtn" onclick="triggerInference()">
                Connect Wallet To Mint →
            </button>
        </div>

        <div class="status-logger" id="statusFeed"></div>
    </div>

    <footer>
        Powered by ritual.net · Created by LiTEino
    </footer>

    <script>
        const RITUAL_TESTNET_PARAMS = {
            chainId: '0x29A', 
            chainName: 'Ritual Testnet',
            rpcUrls: ['https://rpc.ritual.net'], 
            nativeCurrency: { name: 'RITUAL', symbol: 'RITUAL', decimals: 18 },
            blockExplorerUrls: ['https://explorer.ritual.net']
        };

        const CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"; 
        const CONTRACT_ABI = [
            "function requestAvatar(string memory xUsername) external payable returns (bytes32)"
        ];

        let walletAccount = '';

        function handleXTyping(value) {
            const tag = document.getElementById('rectUserTag');
            tag.innerText = value ? (value.startsWith('@') ? value : '@' + value) : '@username';

            const mintBox = document.getElementById('mintContainer');
            if (value.trim().length > 0) {
                mintBox.style.display = 'block';
                setTimeout(() => { mintBox.style.opacity = '1'; }, 10);
            } else {
                mintBox.style.opacity = '0';
                setTimeout(() => { mintBox.style.display = 'none'; }, 300);
            }
        }

        async function connectWallet() {
            if (!window.ethereum) {
                alert("Please install MetaMask first!");
                return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                walletAccount = await signer.getAddress();
                
                const formatAddr = walletAccount.substring(0, 6) + '...' + walletAccount.substring(walletAccount.length - 4);
                
                document.getElementById('walletPillBtn').innerText = formatAddr;
                document.getElementById('bottomActionBtn').innerText = "Mint Identity Avatar →";
                document.getElementById('statusFeed').innerText = "Wallet active on Ritual Network.";

                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: RITUAL_TESTNET_PARAMS.chainId }],
                    });
                } catch (err) {
                    if (err.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [RITUAL_TESTNET_PARAMS],
                        });
                    }
                }
            } catch (e) {
                console.error(e);
                document.getElementById('statusFeed').innerText = "Connection rejected.";
            }
        }

        async function triggerInference() {
            if (!walletAccount) {
                await connectWallet();
                return;
            }

            const usernameVal = document.getElementById('xInput').value;
            if (!usernameVal) {
                alert("Please fill in your X handle!");
                return;
            }

            try {
                document.getElementById('statusFeed').innerText = "Initiating transaction on Ritual Testnet... 🍳";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                
                const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                const tx = await contract.requestAvatar(usernameVal, {
                    value: ethers.utils.parseEther("0.0")
                });

                document.getElementById('statusFeed').innerText = "Awaiting block confirmation... ⏳";
                await tx.wait();

                document.getElementById('statusFeed').innerText = "Cooking your avatar through Ritual AI nodes... 🔮";

                setTimeout(() => {
                    const outputUrl = "https://images.placeholders.dev/?width=400&height=400&text=" + usernameVal;
                    
                    document.getElementById('defaultAvatarSvg').style.display = 'none';
                    const targetImg = document.getElementById('generatedAvatarImg');
                    targetImg.src = outputUrl;
                    targetImg.style.display = 'block';
                    
                    document.getElementById('statusFeed').innerText = "AI Identity Mint Complete! 💎";
                }, 5000);

            } catch (err) {
                console.error(err);
                document.getElementById('statusFeed').innerText = "Transaction failed or denied.";
            }
        }
    </script>
</body>
</html>
