<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · Identity Generator</title>
    <!-- مكتبة Ethers.js للربط مع المحفظة -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <!-- استدعاء خطوط متناسقة وعصرية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     /* لون الخلفية الكريمي الدافئ */
            --card-bg: #e6dfca;      /* لون البطاقات الداخلية */
            --dark-color: #121212;   /* الأسود الغامق للحدود والنصوص */
            --ritual-green: #084c33; /* أخضر ريتشوال الغامق الاحترافي */
            --ritual-light-green: #0cd97e; /* الأخضر المضيء للتنبيهات */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الهيدر العلوي */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        /* شعار ريتشوال في أقصى اليمين */
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-graphic {
            width: 32px;
            height: 32px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .logo-graphic::before {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
        }
        .logo-graphic::after {
            content: '';
            width: 5px;
            height: 5px;
            background-color: var(--dark-color);
            border-radius: 50%;
            position: absolute;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .brand-name {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.3px;
        }
        .brand-desc {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #5c5643;
        }

        /* تغيير شكل وتصميم زر Connect Wallet بالكامل */
        .wallet-pill-btn {
            background-color: var(--ritual-green);
            color: #ffffff;
            border: 2px solid var(--dark-color);
            padding: 10px 24px;
            border-radius: 30px; /* جعل الزر على شكل كبسولة دائرية */
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--dark-color);
            transition: all 0.2s ease;
        }
        .wallet-pill-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--dark-color);
        }
        .wallet-pill-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--dark-color);
        }

        /* الحاوية الرئيسية للموقع */
        .wrapper {
            width: 100%;
            max-width: 500px;
            background: #fbf8f0;
            border: 2px solid var(--dark-color);
            padding: 40px 30px;
            margin-top: 20px;
            margin-bottom: 50px;
            box-shadow: 6px 6px 0px var(--dark-color);
        }

        .top-badge {
            display: inline-block;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            border: 1px solid var(--dark-color);
            padding: 4px 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 25px;
        }
        h1 span {
            color: var(--ritual-green);
        }

        /* تصميم دائرة عرض الأفاتار المتناسقة */
        .avatar-display {
            width: 200px;
            height: 200px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
            margin: 0 auto 30px auto;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0px 4px 10px rgba(0,0,0,0.05);
        }

        .avatar-svg {
            width: 110px;
            height: 110px;
            opacity: 0.3;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .floating-tag {
            position: absolute;
            bottom: 12px;
            background: var(--dark-color);
            color: #ffffff;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
        }

        /* تغيير شكل مكان وضع اليوزر بالكامل (تصميم كبسولة دائري مدمج) */
        .search-capsule-zone {
            margin-bottom: 30px;
            text-align: left;
        }
        .search-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
            color: #4a4433;
        }
        .capsule-input-container {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid var(--dark-color);
            border-radius: 50px; /* حواف دائرية بالكامل */
            padding: 4px;
            box-shadow: 2px 2px 0px var(--dark-color);
            overflow: hidden;
        }
        .capsule-input-container input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 20px;
            font-size: 15px;
            outline: none;
            color: var(--dark-color);
        }
        .capsule-submit-btn {
            background-color: var(--dark-color);
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .capsule-submit-btn:hover {
            background-color: var(--ritual-green);
        }

        /* جدول التفاصيل الصغير السفلي */
        .details-box {
            background-color: var(--card-bg);
            border: 1px solid #cfc7af;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            text-align: left;
            margin-bottom: 25px;
        }
        .details-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .details-item:last-child {
            margin-bottom: 0;
        }
        .details-label {
            color: #615a47;
        }
        .switch-chain-text {
            color: var(--ritual-green);
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }

        /* زر الإجراء الرئيسي السفلي الكبير */
        .bottom-action-btn {
            width: 100%;
            background-color: transparent;
            border: 2px solid var(--dark-color);
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 4px 4px 0px var(--dark-color);
            transition: all 0.1s ease;
        }
        .bottom-action-btn:hover {
            background-color: #f3edd7;
        }

        .status-feed {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            margin-top: 15px;
            color: var(--ritual-green);
            text-align: center;
        }

        footer {
            font-size: 11px;
            color: #7c7560;
            margin-top: auto;
            padding: 20px;
            font-family: 'Courier Prime', monospace;
        }
    </style>
</head>
<body>

    <!-- الترويسة العلوية وبها شعار ريتشوال في أقصى اليمين بالشكل المطلوب -->
    <header>
        <div class="brand-logo">
            <div class="logo-graphic"></div>
            <div class="brand-text">
                <span class="brand-name">Ritual</span>
                <span class="brand-desc">Autonomous Intelligence</span>
            </div>
        </div>
        <!-- شكل زر الـ Connect Wallet الجديد كبسولة دائرية مميزة -->
        <button class="wallet-pill-btn" id="walletPillBtn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <!-- الحاوية الأساسية للموقع -->
    <div class="wrapper">
        <div class="top-badge">Ritual Chain · Testnet 1979</div>
        
        <h1>Mint your AI <span>identity</span></h1>

        <!-- منطقة الأفاتار الدائرية الدقيقة -->
        <div class="avatar-display">
            <!-- أيقونة مستخدم كلاسيكية ناعمة -->
            <svg class="avatar-svg" id="defaultAvatarSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <!-- صورة التوليد الحقيقية -->
            <img src="" id="generatedAvatarImg" class="avatar-img" alt="Ritual Avatar">
            <div class="floating-tag" id="floatingUserTag">@username</div>
        </div>

        <!-- شكل مكان وضع اليوزر الجديد كبسولة دائرية مبتكرة بالكامل -->
        <div class="search-capsule-zone">
            <label class="search-label">X Handle</label>
            <div class="capsule-input-container">
                <input type="text" id="xInput" placeholder="@username" oninput="handleTagChange(this.value)">
                <button class="capsule-submit-btn" onclick="triggerInference()">Load</button>
            </div>
        </div>

        <!-- جدول تفاصيل الاتصال والمحفظة -->
        <div class="details-box">
            <div class="details-item">
                <span class="details-label">Wallet Status</span>
                <span id="lblWallet">Disconnected</span>
            </div>
            <div class="details-item">
                <span class="details-label">Current Chain</span>
                <span id="lblChain">—</span>
            </div>
            <div class="details-item">
                <span class="details-label">Network Action</span>
                <span class="switch-chain-text" onclick="connectWallet()">Switch to Ritual Chain</span>
            </div>
        </div>

        <!-- زر المينت السفلي الكبير -->
        <button class="bottom-action-btn" id="bottomActionBtn" onclick="connectWallet()">
            Connect Wallet To Mint →
        </button>

        <div class="status-feed" id="statusFeed"></div>
    </div>

    <footer>
        Powered by ritual.net · Created by LiTEino
    </footer>

    <script>
        const RITUAL_TESTNET_PARAMS = {
            chainId: '0x29A', 
            chainName: 'Ritual Testnet',
            rpcUrls: ['https://rpc.ritual.net'], 
            nativeCurrency: { name: 'RITUAL', symbol: 'RITUAL', decimals: 18 },
            blockExplorerUrls: ['https://explorer.ritual.net']
        };

        const CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"; 
        const CONTRACT_ABI = [
            "function requestAvatar(string memory xUsername) external payable returns (bytes32)"
        ];

        let walletAccount = '';

        function handleTagChange(value) {
            const tag = document.getElementById('floatingUserTag');
            tag.innerText = value ? (value.startsWith('@') ? value : '@' + value) : '@username';
        }

        async function connectWallet() {
            if (!window.ethereum) {
                alert("Please install MetaMask first!");
                return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                walletAccount = await signer.getAddress();
                
                const formatAddr = walletAccount.substring(0, 6) + '...' + walletAccount.substring(walletAccount.length - 4);
                
                // تحديث الواجهة والـ Pills الجديدة
                document.getElementById('walletPillBtn').innerText = formatAddr;
                document.getElementById('lblWallet').innerText = formatAddr;
                document.getElementById('lblChain').innerText = "Ritual Testnet";
                document.getElementById('bottomActionBtn').innerText = "Mint Identity Avatar →";

                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: RITUAL_TESTNET_PARAMS.chainId }],
                    });
                } catch (err) {
                    if (err.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [RITUAL_TESTNET_PARAMS],
                        });
                    }
                }
                document.getElementById('statusFeed').innerText = "Wallet active on Ritual Network.";
            } catch (e) {
                console.error(e);
                document.getElementById('statusFeed').innerText = "Connection rejected.";
            }
        }

        async function triggerInference() {
            const usernameVal = document.getElementById('xInput').value;
            if (!walletAccount) {
                alert("Please connect your wallet first!");
                return;
            }
            if (!usernameVal) {
                alert("Please fill in your X handle!");
                return;
            }

            try {
                document.getElementById('statusFeed').innerText = "Initiating transaction on Ritual Testnet...";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                
                const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                const tx = await contract.requestAvatar(usernameVal, {
                    value: ethers.utils.parseEther("0.0")
                });

                document.getElementById('statusFeed').innerText = "Awaiting block confirmation... ⏳";
                await tx.wait();

                document.getElementById('statusFeed').innerText = "Tx successful! Cooking your avatar through Ritual AI nodes... 🍳";

                setTimeout(() => {
                    const outputUrl = "https://images.placeholders.dev/?width=400&height=400&text=" + usernameVal;
                    
                    document.getElementById('defaultAvatarSvg').style.display = 'none';
                    const targetImg = document.getElementById('generatedAvatarImg');
                    targetImg.src = outputUrl;
                    targetImg.style.display = 'block';
                    
                    document.getElementById('statusFeed').innerText = "Your customized AI identity has loaded! 💎";
                }, 5000);

            } catch (err) {
                console.error(err);
                document.getElementById('statusFeed').innerText = "Transaction failed or denied.";
            }
        }
    </script>
</body>
</html>
