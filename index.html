<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · Identity Canvas</title>
    <!-- مكتبة Ethers.js للربط مع المحفظة -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     /* الخلفية الكريمية الدافئة */
            --card-bg: #e6dfca;      /* لون البطاقة الداخلي */
            --dark-color: #121212;   /* الأسود الغامق للحدود */
            --ritual-green: #084c33; /* أخضر ريتشوال الغامق */
            --glowing-green: #0cd97e; /* الأخضر المشع للتأثيرات الطقسية */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الهيدر العلوي */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ritual-official-logo {
            width: 45px;
            height: 45px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 2px 2px 0px var(--dark-color);
        }

        .brand-name {
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        .wallet-pill-btn {
            background-color: var(--ritual-green);
            color: #ffffff;
            border: 2px solid var(--dark-color);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--dark-color);
            transition: all 0.2s ease;
        }
        .wallet-pill-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--dark-color);
        }

        /* الحاوية الرئيسية للموقع */
        .main-card {
            width: 100%;
            max-width: 460px;
            background: #fbf8f0;
            border: 2px solid var(--dark-color);
            padding: 40px 30px;
            margin-top: 30px;
            margin-bottom: 50px;
            box-shadow: 8px 8px 0px var(--dark-color);
            text-align: center;
        }

        .top-badge {
            display: inline-block;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            border: 1px solid var(--dark-color);
            padding: 4px 12px;
            border-radius: 4px;
            margin-bottom: 25px;
            background-color: var(--card-bg);
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 35px;
        }
        h1 span {
            color: var(--ritual-green);
        }

        /* تعديل البانر ليصبح مستطيلاً مسطحاً (Flat Rectangle Canvas) */
        .identity-banner-rect {
            position: relative;
            width: 240px;
            height: 280px; /* شكل مستطيل عمودي أنيق */
            margin: 0 auto 35px auto;
            border: 2px solid var(--dark-color);
            background-color: var(--card-bg);
            box-shadow: 5px 5px 0px var(--dark-color);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* رمز يعبر عن طقوس ريتشوال (مذبح مبسط مع شمعة ورمز مشع) */
        .ritual-altar-icon {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 100%;
            padding-bottom: 40px;
            opacity: 0.15; /* خلفية هادئة مدمجة */
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .ritual-candle-flame {
            width: 12px;
            height: 18px;
            background-color: var(--glowing-green);
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 12px var(--glowing-green);
            margin-bottom: 4px;
        }

        .ritual-altar-stone {
            width: 70px;
            height: 50px;
            border: 2px solid var(--dark-color);
            background-color: #5c5542;
            position: relative;
        }
        .ritual-altar-stone::after {
            content: '☤'; /* رمز غامض بسيط */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--glowing-green);
            font-size: 16px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            position: relative;
            z-index: 2;
        }

        .floating-tag {
            position: absolute;
            bottom: 15px;
            background: var(--dark-color);
            color: #ffffff;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 0px; /* حواف حادة ملائمة للمستطيل */
            border: 1px solid #ffffff;
            z-index: 3;
        }

        /* منطقة وضع اليوزر الكبسولية المتفاعلة */
        .search-zone {
            margin-bottom: 25px;
            text-align: left;
        }
        .search-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: block;
            color: #4a4433;
        }
        .capsule-input-container {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 2px solid var(--dark-color);
            border-radius: 50px;
            padding: 4px;
            box-shadow: 3px 3px 0px var(--dark-color);
        }
        .capsule-input-container input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 20px;
            font-size: 15px;
            outline: none;
            color: var(--dark-color);
        }

        /* زر المينت السفلي الكبير (تم ضبطه ليختفي ويظهر فقط بعد إدخال اليوزر) */
        .mint-submit-btn {
            display: none; /* مخفي افتراضياً */
            width: 100%;
            background-color: transparent;
            border: 2px solid var(--dark-color);
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 4px 4px 0px var(--dark-color);
            transition: all 0.1s ease;
            margin-top: 10px;
            animation: fadeInBtn 0.3s ease-in-out forwards;
        }
        .mint-submit-btn:hover {
            background-color: #f3edd7;
        }

        @keyframes fadeInBtn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-logger {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            margin-top: 18px;
            color: var(--ritual-green);
            font-weight: bold;
        }

        footer {
            font-size: 11px;
            color: #7c7560;
            margin-top: auto;
            padding: 20px;
            font-family: 'Courier Prime', monospace;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="ritual-official-logo" alt="Ritual Logo">
            <span class="brand-name">Ritual</span>
        </div>
        <button class="wallet-pill-btn" id="walletPillBtn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <div class="main-card">
        <div class="top-badge">Ritual Chain · Testnet 1979</div>
        
        <h1>Generate AI <span>Identity</span></h1>

        <!-- البانر المستطيل الجديد المحتوي على تلميحات طقوس ريتشوال البديلة -->
        <div class="identity-banner-rect" id="bannerRect">
            <!-- رمز المذبح والطلب الخاص بريتشوال خلف الأفاتار -->
            <div class="ritual-altar-icon" id="altarIcon">
                <div class="ritual-candle-flame"></div>
                <div class="ritual-altar-stone"></div>
            </div>
            
            <img src="" id="generatedAvatarImg" class="avatar-img" alt="Ritual Identity">
            <div class="floating-tag" id="floatingUserTag">@username</div>
        </div>

        <!-- خانة وضع اليوزر النظيفة وبدون أي معلومات تحتها -->
        <div class="search-zone">
            <label class="search-label">X Handle</label>
            <div class="capsule-input-container">
                <input type="text" id="xInput" placeholder="@username" oninput="handleInputChange(this.value)">
            </div>
        </div>

        <!-- زر المينت الذكي الذي يظهر مشروطاً فقط بعد إدخال النص -->
        <button class="mint-submit-btn" id="bottomActionBtn" onclick="triggerInference()">
            Mint Identity Avatar →
        </button>

        <div class="status-logger" id="statusFeed"></div>
    </div>

    <footer>
        Powered by ritual.net · Created by LiTEino
    </footer>

    <script>
        const RITUAL_TESTNET_PARAMS = {
            chainId: '0x29A', 
            chainName: 'Ritual Testnet',
            rpcUrls: ['https://rpc.ritual.net'], 
            nativeCurrency: { name: 'RITUAL', symbol: 'RITUAL', decimals: 18 },
            blockExplorerUrls: ['https://explorer.ritual.net']
        };

        const CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"; 
        const CONTRACT_ABI = [
            "function requestAvatar(string memory xUsername) external payable returns (bytes32)"
        ];

        let walletAccount = '';

        // التحكم في ظهور زر المينت وتحديث التاج بناءً على الكتابة
        function handleInputChange(value) {
            const tag = document.getElementById('floatingUserTag');
            const mintBtn = document.getElementById('bottomActionBtn');
            const altar = document.getElementById('altarIcon');
            
            // تحديث النص العائم
            tag.innerText = value ? (value.startsWith('@') ? value : '@' + value) : '@username';
            
            // إظهار أو إخفاء زر المينت بناءً على وجود يوزر
            if (value.trim().length > 0) {
                mintBtn.style.display = 'block';
                altar.style.opacity = '0.4'; // يزداد وهج المذبح كإشارة تفاعلية
            } else {
                mintBtn.style.display = 'none';
                altar.style.opacity = '0.15';
            }
        }

        async function connectWallet() {
            if (!window.ethereum) {
                alert("Please install MetaMask first!");
                return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                walletAccount = await signer.getAddress();
                
                const formatAddr = walletAccount.substring(0, 6) + '...' + walletAccount.substring(walletAccount.length - 4);
                document.getElementById('walletPillBtn').innerText = formatAddr;
                document.getElementById('statusFeed').innerText = "Wallet linked successfully.";

                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: RITUAL_TESTNET_PARAMS.chainId }],
                    });
                } catch (err) {
                    if (err.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [RITUAL_TESTNET_PARAMS],
                        });
                    }
                }
            } catch (e) {
                console.error(e);
                document.getElementById('statusFeed').innerText = "Wallet linkage rejected.";
            }
        }

        async function triggerInference() {
            const usernameVal = document.getElementById('xInput').value;
            if (!walletAccount) {
                // إذا لم يربط المحفظة يطلب منه ذلك أولاً
                await connectWallet();
                return;
            }
            if (!usernameVal) return;

            try {
                document.getElementById('statusFeed').innerText = "Sending transaction to Ritual Testnet...";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                
                const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                const tx = await contract.requestAvatar(usernameVal, {
                    value: ethers.utils.parseEther("0.0")
                });

                document.getElementById('statusFeed').innerText = "Awaiting block confirmation... ⏳";
                await tx.wait();

                document.getElementById('statusFeed').innerText = "Cooking your identity avatar through AI nodes... 🍳";

                setTimeout(() => {
                    const outputUrl = "https://images.placeholders.dev/?width=400&height=400&text=" + usernameVal;
                    
                    document.getElementById('altarIcon').style.display = 'none';
                    const targetImg = document.getElementById('generatedAvatarImg');
                    targetImg.src = outputUrl;
                    targetImg.style.display = 'block';
                    
                    document.getElementById('statusFeed').innerText = "Your decentralized AI Avatar is fully baked! 💎";
                }, 5000);

            } catch (err) {
                console.error(err);
                document.getElementById('statusFeed').innerText = "Transaction failed or denied.";
            }
        }
    </script>
</body>
</html>
