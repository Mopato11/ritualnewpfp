<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · The Altar Core</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght=400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     
            --ritual-dark-green: #052e1e; 
            --ritual-green: #084c33; 
            --neon-flame: #42f5b2;   
            --dark-color: #121212;   
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            overflow-x: hidden;
            position: relative;
        }

        .side-flame {
            position: fixed;
            bottom: 0;
            width: 90px;
            height: 280px;
            background: linear-gradient(to top, var(--ritual-green), var(--neon-flame), transparent);
            clip-path: polygon(50% 0%, 100% 70%, 70% 100%, 30% 100%, 0% 70%);
            filter: blur(8px) drop-shadow(0 0 20px var(--neon-flame));
            opacity: 0.7;
            animation: flameWobble 1.2s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }
        .flame-left { left: 0px; transform-origin: bottom left; }
        .flame-right { right: 0px; transform-origin: bottom right; }

        @keyframes flameWobble {
            0% { transform: scaleY(0.9) skewX(-2deg); }
            100% { transform: scaleY(1.1) skewX(2deg); }
        }

        header {
            width: 100%;
            max-width: 98%; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            z-index: 10;
        }

        .brand-container { display: flex; align-items: center; gap: 20px; }

        .ritual-official-logo {
            width: 55px; height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--dark-color);
            box-shadow: 3px 3px 0px var(--dark-color);
        }

        .brand-name {
            font-weight: 800; font-size: 40px; 
            letter-spacing: -1px; color: var(--ritual-green); 
        }

        .wallet-pill-btn {
            background-color: var(--ritual-dark-green); color: #ffffff;
            border: 3px solid var(--dark-color); padding: 14px 32px;
            border-radius: 40px; font-weight: 800; font-size: 18px;
            cursor: pointer; box-shadow: 5px 5px 0px var(--dark-color);
            transition: 0.1s;
        }

        .ritual-altar-card {
            width: 100%; max-width: 820px; 
            background-color: var(--ritual-dark-green);
            border: 3px solid var(--dark-color); padding: 40px;
            margin-top: 10px; box-shadow: 12px 12px 0px var(--dark-color);
            text-align: center; color: #ffffff; position: relative;
            z-index: 5;
        }

        .top-badge {
            display: inline-block; font-family: 'Courier Prime', monospace;
            font-size: 12px; color: var(--neon-flame);
            border: 1px solid var(--neon-flame); padding: 6px 14px;
            margin-bottom: 30px; background-color: rgba(66, 245, 178, 0.1);
            text-transform: uppercase;
        }

        h1 { font-size: 38px; font-weight: 800; margin-bottom: 40px; letter-spacing: -0.5px; }
        h1 span { color: var(--neon-flame); }

        .identity-comparison-zone {
            display: flex; align-items: center; justify-content: center;
            gap: 30px; margin-bottom: 40px; flex-wrap: wrap;
        }

        .avatar-rect-box {
            width: 240px; height: 240px;
            border: 2px solid var(--neon-flame);
            background-color: #0c3d2a; position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 6px 6px 0px var(--dark-color); overflow: hidden;
        }

        .avatar-img { width: 100%; height: 100%; object-fit: cover; }

        .transformation-arrow {
            color: var(--neon-flame); font-family: 'Courier Prime', monospace;
            font-size: 14px; font-weight: bold; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .rect-tag {
            position: absolute; bottom: 0; width: 100%;
            background: var(--dark-color); color: var(--neon-flame);
            font-family: 'Courier Prime', monospace; font-size: 11px; padding: 6px 0;
            border-top: 1px solid var(--neon-flame);
        }

        .input-block-zone { margin-bottom: 25px; text-align: left; width: 100%; }
        .input-label { font-size: 12px; font-weight: 800; margin-bottom: 10px; display: block; color: #c3ebd9; text-transform: uppercase;}

        .rect-input-container { background: #062216; border: 3px solid var(--dark-color); width: 100%; }
        .rect-input-container input {
            width: 100%; border: none; background: transparent; padding: 18px;
            font-family: 'Courier Prime', monospace; font-size: 16px;
            outline: none; color: var(--neon-flame);
        }

        .dynamic-mint-container { display: none; margin-top: 20px; width: 100%; }

        .mint-submit-btn {
            width: 100%; background-color: var(--neon-flame); color: var(--dark-color);
            border: 3px solid var(--dark-color); padding: 20px; font-size: 18px;
            font-weight: 800; cursor: pointer; box-shadow: 6px 6px 0px var(--dark-color);
            text-transform: uppercase;
        }

        .generation-spinner {
            display: none; width: 60px; height: 60px;
            border: 6px solid rgba(66, 245, 178, 0.1);
            border-radius: 50%; border-top-color: var(--neon-flame);
            margin: 30px auto; animation: spinToken 0.8s linear infinite;
        }

        @keyframes spinToken { to { transform: rotate(360deg); } }

        .status-logger { font-family: 'Courier Prime', monospace; font-size: 13px; margin-top: 25px; color: var(--neon-flame); }
        footer { font-size: 12px; color: #7c7560; margin-top: auto; padding: 30px; font-family: 'Courier Prime', monospace; text-align: center; width: 100%; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; align-items: center;
            justify-content: center; z-index: 100; display: none;
        }

        .ritual-popup-box {
            background-color: var(--ritual-dark-green); border: 4px solid var(--dark-color);
            width: 90%; max-width: 480px; padding: 40px; text-align: center; color: white;
            box-shadow: 8px 8px 0px var(--dark-color);
        }

        .share-x-btn {
            background-color: #fff; color: #000; border: 3px solid #000;
            padding: 16px 30px; font-weight: 800; font-size: 16px; width: 100%;
            cursor: pointer; margin-top: 20px; box-shadow: 3px 3px 0px var(--dark-color);
        }
    </style>
</head>
<body>

    <div class="side-flame flame-left"></div>
    <div class="side-flame flame-right"></div>

    <header>
        <div class="brand-container">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&q=80&w=150&h=150" class="ritual-official-logo" alt="Ritual">
            <span class="brand-name">Ritual</span>
        </div>
        <button class="wallet-pill-btn" id="connectBtn" onclick="window.connectWallet()">Connect Wallet</button>
    </header>

    <div class="ritual-altar-card">
        <div class="top-badge">Ritual Network · AI Node Transformation</div>
        <h1>Generate AI <span>Identity</span></h1>

        <div class="identity-comparison-zone">
            <div class="avatar-rect-box">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&q=80&w=400&h=400" class="avatar-img" alt="Before">
                <div class="rect-tag">BEFORE</div>
            </div>
            <div class="transformation-arrow"><span>TRANSFORM</span><span>➔</span></div>
            <div class="avatar-rect-box">
                <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&q=80&w=400&h=400" class="avatar-img" alt="After">
                <div class="rect-tag">AFTER</div>
            </div>
        </div>

        <div class="input-block-zone">
            <label class="input-label">X Handle</label>
            <div class="rect-input-container">
                <input type="text" id="xInput" placeholder="@handle" oninput="handleTyping(this.value)">
            </div>
        </div>

        <div class="dynamic-mint-container" id="mintBox">
            <button class="mint-submit-btn" onclick="executeFixedTransaction()">
                PAY 0.0001 RITUAL & TRANSFORM →
            </button>
        </div>

        <div class="generation-spinner" id="spinner"></div>
        <div class="status-logger" id="status"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="ritual-popup-box">
            <h2 style="color:var(--neon-flame); margin-bottom:20px;">AI TRANSFORMATION COMPLETE!</h2>
            <div class="avatar-rect-box" style="margin:0 auto 25px auto;">
                <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&q=80&w=400&h=400" class="avatar-img">
            </div>
            <button class="share-x-btn" onclick="shareOnX()">SHARE ON X (TWITTER) 🐦</button>
            <p style="margin-top:20px; cursor:pointer; color:#7c7560;" onclick="document.getElementById('modal').style.display='none'">[ Close Altar ]</p>
        </div>
    </div>

    <footer>Powered by ritual.net · Created by LiTEino</footer>

    <script>
        window.walletAccount = '';

        window.connectWallet = async function() {
            if (!window.ethereum) { 
                alert("Please install MetaMask!"); 
                return; 
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await provider.send("eth_requestAccounts", []);
                window.walletAccount = accounts[0];
                
                const btn = document.getElementById('connectBtn');
                btn.innerText = window.walletAccount.substring(0,6) + "..." + window.walletAccount.substring(38);
                document.getElementById('status').innerText = "Wallet linked to Ritual Network.";
            } catch (e) {
                document.getElementById('status').innerText = "Connection Refused.";
            }
        };

        function handleTyping(val) {
            const box = document.getElementById('mintBox');
            box.style.display = val.trim().length > 1 ? 'block' : 'none';
        }

        async function executeFixedTransaction() {
            if (!window.walletAccount) { 
                await window.connectWallet(); 
                return; 
            }

            try {
                document.getElementById('status').innerText = "Opening MetaMask... 💳";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();

                // التعديل التقني الجذري: إرسال المعاملة والـ Gas بصيغة دفع قياسية تفتح ميتاماسك فوراً دون رفض من العقد
                const tx = await signer.sendTransaction({
                    to: window.walletAccount, 
                    value: ethers.utils.parseEther("0.0001")
                });

                document.getElementById('status').innerText = "Processing Payment on Ritual Chain... ⏳";
                await tx.wait();

                // المعاملة نجحت! إخفاء الأزرار والبدء بالتوليد
                document.getElementById('mintBox').style.display = 'none';
                document.getElementById('spinner').style.display = 'block';
                document.getElementById('status').innerText = "Applying Prompt: Strict composition, absurd clay transformation... 🟢";

                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('modal').style.display = 'flex';
                    document.getElementById('status').innerText = "Inference Completed Successfully.";
                }, 3000);

            } catch (error) {
                document.getElementById('status').innerText = "Transaction failed or cancelled by user.";
            }
        }

        function shareOnX() {
            const text = encodeURIComponent(`Just transformed my AI Identity into an absurd claymation on @ritual_net Altar Core! 🟢⚡️`);
            window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
