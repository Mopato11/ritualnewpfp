<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · Identity Scanner</title>
    <!-- مكتبة Ethers.js للربط مع المحفظة -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     /* الخلفية الكريمية الدافئة */
            --card-bg: #e6dfca;      /* لون البطاقة الداخلي */
            --dark-color: #121212;   /* الأسود الغامق للحدود */
            --ritual-green: #084c33; /* أخضر ريتشوال الغامق */
            --neon-green: #0cd97e;   /* الأخضر المضيء للتأثيرات */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الهيدر العلوي */
        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        /* وضع شعار ريتشوال الرسمي في أعلى الجانب الأيمن */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ritual-official-logo {
            width: 45px;
            height: 45px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 2px 2px 0px var(--dark-color);
        }

        .brand-name {
            font-weight: 800;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        /* زر المحفظة الدائري الأنيق */
        .wallet-pill-btn {
            background-color: var(--ritual-green);
            color: #ffffff;
            border: 2px solid var(--dark-color);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--dark-color);
            transition: all 0.2s ease;
        }
        .wallet-pill-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--dark-color);
        }

        /* الحاوية الرئيسية للموقع */
        .main-card {
            width: 100%;
            max-width: 460px;
            background: #fbf8f0;
            border: 2px solid var(--dark-color);
            padding: 40px 30px;
            margin-top: 30px;
            margin-bottom: 50px;
            box-shadow: 8px 8px 0px var(--dark-color);
            text-align: center;
        }

        .top-badge {
            display: inline-block;
            font-family: 'Courier Prime', monospace;
            font-size: 11px;
            border: 1px solid var(--dark-color);
            padding: 4px 12px;
            border-radius: 4px;
            margin-bottom: 25px;
            background-color: var(--card-bg);
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 35px;
        }
        h1 span {
            color: var(--ritual-green);
        }

        /* التصميم الفريد: دمج خانة وضع اليوزر مع رادار الأفاتار الدائري */
        .identity-scanner-zone {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto 40px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* حلقة الرادار الخارجية الدوارة التفاعلية */
        .scanner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed #999999;
            border-radius: 50%;
            animation: rotateRadar 20s linear infinite;
            transition: border-color 0.3s ease;
        }

        @keyframes rotateRadar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* الدائرة الداخلية الحاضنة للأفاتار والمدخل */
        .avatar-core {
            width: 210px;
            height: 210px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
            background-color: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0px 4px 12px rgba(0,0,0,0.06);
        }

        .avatar-svg {
            width: 100px;
            height: 100px;
            opacity: 0.25;
            transition: opacity 0.3s;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* خانة إدخال اليوزر المبتكرة: تطفو كعلامة رقمية أسفل الرادار ومدمجة به */
        .floating-input-badge {
            position: absolute;
            bottom: -15px;
            width: 85%;
            background: #ffffff;
            border: 2px solid var(--dark-color);
            border-radius: 20px;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            box-shadow: 3px 3px 0px var(--dark-color);
            transition: border-color 0.3s;
        }

        .floating-input-badge input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 10px 15px;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            color: var(--dark-color);
            text-align: center;
        }

        .scanner-scan-btn {
            background-color: var(--dark-color);
            color: #ffffff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            font-size: 14px;
        }
        .scanner-scan-btn:hover {
            background-color: var(--ritual-green);
        }

        /* جدول التفاصيل السفلي */
        .details-grid {
            background-color: var(--card-bg);
            border: 1px solid #cfc7af;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            text-align: left;
            margin-bottom: 30px;
        }
        .details-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .details-row:last-child {
            margin-bottom: 0;
        }
        .details-label {
            color: #5c5542;
        }
        .switch-link {
            color: var(--ritual-green);
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }

        /* زر المينت الكبير السفلي */
        .mint-submit-btn {
            width: 100%;
            background-color: transparent;
            border: 2px solid var(--dark-color);
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 4px 4px 0px var(--dark-color);
            transition: all 0.1s ease;
        }
        .mint-submit-btn:hover {
            background-color: #f3edd7;
        }

        .status-logger {
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            margin-top: 18px;
            color: var(--ritual-green);
            font-weight: bold;
        }

        footer {
            font-size: 11px;
            color: #7c7560;
            margin-top: auto;
            padding: 20px;
            font-family: 'Courier Prime', monospace;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي وبداخلة الشعار الرسمي لـ ريتشوال في أقصى الجانب بدون النص الإضافي -->
    <header>
        <div class="brand-container">
            <img src="https://pbs.twimg.com/profile_images/2047761933764268032/ltdZOulq_400x400.jpg" class="ritual-official-logo" alt="Ritual Logo">
            <span class="brand-name">Ritual</span>
        </div>
        <button class="wallet-pill-btn" id="walletPillBtn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <!-- بطاقة المينت الرئيسية المعززة بالتصميم المبتكر -->
    <div class="main-card">
        <div class="top-badge">Ritual Chain · Testnet 1979</div>
        
        <h1>Generate AI <span>Identity</span></h1>

        <!-- منطقة الرادار المدمجة الفريدة (تم دمج خانة اليوزر داخل التصميم الدائري نفسه) -->
        <div class="identity-scanner-zone">
            <!-- حلقة الرادار الخارجية الدوارة تعطي شكل المسح الذكي -->
            <div class="scanner-ring" id="radarRing"></div>
            
            <!-- قلب الأفاتار الدائري -->
            <div class="avatar-core" id="avatarCore">
                <svg class="avatar-svg" id="defaultAvatarSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="7" r="4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <img src="" id="generatedAvatarImg" class="avatar-img" alt="Ritual Identity">
            </div>

            <!-- خانة وضع اليوزر العائمة والمبتكرة كلياً مدمجة أسفل الدائرة -->
            <div class="floating-input-badge" id="inputBadge">
                <input type="text" id="xInput" placeholder="@handle" onfocus="activateScanner()" onblur="deactivateScanner()">
                <button class="scanner-scan-btn" onclick="triggerInference()">→</button>
            </div>
        </div>

        <!-- جدول تفاصيل شبكة الـ Testnet -->
        <div class="details-grid">
            <div class="details-row">
                <span class="details-label">Wallet Address</span>
                <span id="lblWallet">Disconnected</span>
            </div>
            <div class="details-row">
                <span class="details-label">Current Chain</span>
                <span id="lblChain">—</span>
            </div>
            <div class="details-row">
                <span class="details-label">Network Action</span>
                <span class="switch-link" onclick="connectWallet()">Switch to Ritual Chain</span>
            </div>
        </div>

        <!-- زر المينت السفلي الكبير -->
        <button class="mint-submit-btn" id="bottomActionBtn" onclick="connectWallet()">
            Connect Wallet To Mint →
        </button>

        <div class="status-logger" id="statusFeed"></div>
    </div>

    <footer>
        Powered by ritual.net · Created by LiTEino
    </footer>

    <script>
        const RITUAL_TESTNET_PARAMS = {
            chainId: '0x29A', 
            chainName: 'Ritual Testnet',
            rpcUrls: ['https://rpc.ritual.net'], 
            nativeCurrency: { name: 'RITUAL', symbol: 'RITUAL', decimals: 18 },
            blockExplorerUrls: ['https://explorer.ritual.net']
        };

        const CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"; 
        const CONTRACT_ABI = [
            "function requestAvatar(string memory xUsername) external payable returns (bytes32)"
        ];

        let walletAccount = '';

        // تفاعلات بصرية فريدة لخانة اليوزر عند الكتابة والتركيز
        function activateScanner() {
            document.getElementById('radarRing').style.borderColor = 'var(--ritual-green)';
            document.getElementById('avatarCore').style.borderColor = 'var(--ritual-green)';
            document.getElementById('inputBadge').style.borderColor = 'var(--ritual-green)';
        }

        function deactivateScanner() {
            document.getElementById('radarRing').style.borderColor = '#999999';
            document.getElementById('avatarCore').style.borderColor = 'var(--dark-color)';
            document.getElementById('inputBadge').style.borderColor = 'var(--dark-color)';
        }

        async function connectWallet() {
            if (!window.ethereum) {
                alert("Please install MetaMask first!");
                return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                walletAccount = await signer.getAddress();
                
                const formatAddr = walletAccount.substring(0, 6) + '...' + walletAccount.substring(walletAccount.length - 4);
                
                document.getElementById('walletPillBtn').innerText = formatAddr;
                document.getElementById('lblWallet').innerText = formatAddr;
                document.getElementById('lblChain').innerText = "Ritual Testnet";
                document.getElementById('bottomActionBtn').innerText = "Mint Identity Avatar →";
                document.getElementById('statusFeed').innerText = "Wallet active on Ritual Network.";

                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: RITUAL_TESTNET_PARAMS.chainId }],
                    });
                } catch (err) {
                    if (err.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [RITUAL_TESTNET_PARAMS],
                        });
                    }
                }
            } catch (e) {
                console.error(e);
                document.getElementById('statusFeed').innerText = "Connection rejected.";
            }
        }

        async function triggerInference() {
            const usernameVal = document.getElementById('xInput').value;
            if (!walletAccount) {
                alert("Please connect your wallet first!");
                return;
            }
            if (!usernameVal) {
                alert("Please fill in your X handle!");
                return;
            }

            try {
                document.getElementById('statusFeed').innerText = "Initiating transaction on Ritual Testnet...";
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                
                const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                const tx = await contract.requestAvatar(usernameVal, {
                    value: ethers.utils.parseEther("0.0")
                });

                document.getElementById('statusFeed').innerText = "Scanning network for node response... ⏳";
                // جعل الأنيميشن أسرع أثناء المعالجة لتأثير بصري رائع
                document.getElementById('radarRing').style.animationDuration = '3s';
                await tx.wait();

                document.getElementById('statusFeed').innerText = "Cooking your avatar through Ritual AI nodes... 🍳";

                setTimeout(() => {
                    const outputUrl = "https://images.placeholders.dev/?width=400&height=400&text=" + usernameVal;
                    
                    document.getElementById('defaultAvatarSvg').style.display = 'none';
                    const targetImg = document.getElementById('generatedAvatarImg');
                    targetImg.src = outputUrl;
                    targetImg.style.display = 'block';
                    
                    document.getElementById('radarRing').style.animationDuration = '20s';
                    document.getElementById('statusFeed').innerText = "AI Identity Scanner Complete! 💎";
                }, 5000);

            } catch (err) {
                console.error(err);
                document.getElementById('radarRing').style.animationDuration = '20s';
                document.getElementById('statusFeed').innerText = "Transaction failed or denied.";
            }
        }
    </script>
</body>
</html>
