<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual · The Altar Core</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f3edd7;     
            --ritual-dark-green: #052e1e; 
            --ritual-green: #084c33; 
            --neon-flame: #42f5b2;   
            --dark-color: #121212;   
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--dark-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .brand-container { display: flex; align-items: center; gap: 12px; }

        .ritual-official-logo {
            width: 40px; height: 40px;
            border: 2px solid var(--dark-color);
            border-radius: 50%;
        }

        .brand-name {
            font-weight: 800; font-size: 26px; 
            color: var(--ritual-green); 
        }

        .wallet-pill-btn {
            background-color: var(--ritual-green); color: #ffffff;
            border: 2px solid var(--dark-color); padding: 8px 20px;
            border-radius: 30px; font-weight: 600; font-size: 13px;
            cursor: pointer; box-shadow: 2px 2px 0px var(--dark-color);
        }

        .ritual-altar-card {
            width: 100%; max-width: 820px; 
            background-color: var(--ritual-dark-green);
            border: 3px solid var(--dark-color); padding: 30px;
            margin-top: 10px; box-shadow: 8px 8px 0px var(--dark-color);
            text-align: center; color: #ffffff; position: relative;
        }

        .top-badge {
            display: inline-block; font-family: 'Courier Prime', monospace;
            font-size: 11px; color: var(--neon-flame);
            border: 1px solid var(--neon-flame); padding: 4px 12px;
            margin-bottom: 20px; background-color: rgba(66, 245, 178, 0.1);
        }

        h1 { font-size: 32px; font-weight: 800; margin-bottom: 30px; }
        h1 span { color: var(--neon-flame); }

        .identity-comparison-zone {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; margin-bottom: 30px; flex-wrap: wrap;
        }

        .avatar-rect-box {
            width: 220px; height: 220px;
            border: 2px solid var(--neon-flame);
            background-color: #0c3d2a; position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 4px 0px var(--dark-color); overflow: hidden;
        }

        .avatar-rect-box.after-box { border-color: #7c7560; background-color: #062216; }

        .avatar-img { width: 100%; height: 100%; object-fit: cover; }

        .transformation-arrow {
            color: var(--neon-flame); font-family: 'Courier Prime', monospace;
            font-size: 12px; font-weight: bold; padding: 10px;
        }

        .rect-tag {
            position: absolute; bottom: 0; width: 100%;
            background: var(--dark-color); color: var(--neon-flame);
            font-family: 'Courier Prime', monospace; font-size: 11px; padding: 4px 0;
        }

        .input-block-zone { margin-bottom: 20px; text-align: left; width: 100%; }
        .input-label { font-size: 11px; font-weight: 700; margin-bottom: 6px; display: block; color: #c3ebd9; }

        .rect-input-container { background: #062216; border: 2px solid var(--dark-color); width: 100%; }
        .rect-input-container input {
            width: 100%; border: none; background: transparent; padding: 14px;
            font-family: 'Courier Prime', monospace; font-size: 14px;
            outline: none; color: var(--neon-flame);
        }

        .dynamic-mint-container { display: none; opacity: 0; margin-top: 15px; width: 100%; }

        .mint-submit-btn {
            width: 100%; background-color: var(--neon-flame); color: var(--dark-color);
            border: 2px solid var(--dark-color); padding: 16px; font-size: 15px;
            font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0px var(--dark-color);
        }

        .status-logger { font-family: 'Courier Prime', monospace; font-size: 12px; margin-top: 20px; color: var(--neon-flame); }
        footer { font-size: 11px; color: #7c7560; margin-top: auto; padding: 20px; font-family: 'Courier Prime', monospace; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <img src="https://i.postimg.cc/zB89cdf5/373-vkbv-400x400.jpg" class="ritual-official-logo" alt="Logo">
            <span class="brand-name">Ritual</span>
        </div>
        <button class="wallet-pill-btn" id="walletPillBtn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <div class="ritual-altar-card">
        <div class="top-badge">Ritual Network · AI Node Transformation</div>
        <h1>Generate AI <span>Identity</span></h1>

        <div class="identity-comparison-zone">
            <div class="avatar-rect-box">
                <img src="https://i.postimg.cc/zB89cdf5/373-vkbv-400x400.jpg" class="avatar-img" alt="Before">
                <div class="rect-tag">BEFORE</div>
            </div>

            <div class="transformation-arrow">TRANSFORM →</div>

            <div class="avatar-rect-box after-box" id="afterBoxOuter">
                <img src="https://i.postimg.cc/s2NTpwZX/Untitled-design-2026-06-03T212647-727.jpg" id="generatedAvatarImg" class="avatar-img" style="display: none;" alt="After">
                <div class="rect-tag" id="afterTag">AFTER</div>
            </div>
        </div>

        <div class="input-block-zone">
            <label class="input-label">X Handle</label>
            <div class="rect-input-container">
                <input type="text" id="xInput" placeholder="@handle" oninput="handleXTyping(this.value)">
            </div>
        </div>

        <div class="dynamic-mint-container" id="mintContainer">
            <button class="mint-submit-btn" id="bottomActionBtn" onclick="processPaymentAndInference()">
                Connect Wallet To Mint →
            </button>
        </div>

        <div class="status-logger" id="statusFeed"></div>
    </div>

    <footer>Powered by ritual.net · Created by LiTEino</footer>
